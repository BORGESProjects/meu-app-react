spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.sql.init.schema-locations=classpath:acervo-schema.sql,classpath:acervo-security.sql,classpath:pagamentos-schema.sql
# Let PostgreSQL parse the complete script, including semicolons inside DO $$.
spring.sql.init.separator=^^^ END OF SCRIPT ^^^

app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
app.payment.monthly-price=${PAYMENT_MONTHLY_PRICE_BRL:9.90}
app.payment.prices.basic.monthly=${PAYMENT_PRICE_BASIC_MONTHLY_BRL:9.90}
app.payment.prices.premium.monthly=${PAYMENT_PRICE_PREMIUM_MONTHLY_BRL:19.90}
app.payment.discount.quarterly=${PAYMENT_DISCOUNT_QUARTERLY:0.25}
app.payment.discount.annual=${PAYMENT_DISCOUNT_ANNUAL:0.30}
app.payment.oauth.client-id=${MERCADO_PAGO_CLIENT_ID:}
app.payment.oauth.client-secret=${MERCADO_PAGO_CLIENT_SECRET:}
app.payment.oauth.redirect-uri=${PAYMENT_OAUTH_REDIRECT_URI:}
app.payment.token-encryption-key=${PAYMENT_TOKEN_ENCRYPTION_KEY:}
app.payment.admin-return-url=${PAYMENT_ADMIN_RETURN_URL:https://ap-aprovado.pages.dev/aluno.html#recebimentos}
app.payment.return-url=${PAYMENT_RETURN_URL:https://ap-aprovado.pages.dev/aluno.html?pagamento=retorno}

app.payment.notification-url=${PAYMENT_NOTIFICATION_URL:${RENDER_EXTERNAL_URL:}/api/acesso/webhook/mercado-pago}
