[package]
name = "ap-aprovado"
version = "0.2.1"
description = "AP Aprovado - estudo e acervo offline"
authors = ["AP Aprovado"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# O instalador mantém o banco textual local; figuras são carregadas sob demanda.
# Isso evita incluir centenas de MB de mídia no instalador Windows e no APK.
tauri = { version = "2.12.5", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"

